<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 232" width="240" height="232" role="img" aria-label="A baron-bailie's cap of justice: green, turned up silver, with two gold guards and green strings">
<defs>
<linearGradient id="cv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8a43"/><stop offset="1" stop-color="#1c6a30"/></linearGradient>
<linearGradient id="ca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcdcdc"/></linearGradient>
<linearGradient id="co" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecc75a"/><stop offset="1" stop-color="#c39a23"/></linearGradient>
</defs>
<!-- strings Vert, hanging in curls each side -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M44,112 C12,112 2,132 24,142 C48,153 50,166 30,176 C12,185 14,202 34,210 C44,214 50,220 50,226" stroke="#14501f" stroke-width="7.5"/>
<path d="M44,112 C12,112 2,132 24,142 C48,153 50,166 30,176 C12,185 14,202 34,210 C44,214 50,220 50,226" stroke="#2a7f3d" stroke-width="4.2"/>
<path d="M196,112 C228,112 238,132 216,142 C192,153 190,166 210,176 C228,185 226,202 206,210 C196,214 190,220 190,226" stroke="#14501f" stroke-width="7.5"/>
<path d="M196,112 C228,112 238,132 216,142 C192,153 190,166 210,176 C228,185 226,202 206,210 C196,214 190,220 190,226" stroke="#2a7f3d" stroke-width="4.2"/>
</g>
<!-- the cap Vert, its crown gathered in four soft folds -->
<path d="M42,104 C30,78 34,50 58,42 C66,26 92,24 102,38 C110,26 130,26 138,38 C148,24 174,26 182,42 C206,50 210,78 198,104 Z" fill="url(#cv)" stroke="#123f1a" stroke-width="1.6" stroke-linejoin="round"/>
<g fill="none" stroke="#123f1a" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
<path d="M102,38 C100,52 98,60 96,68"/><path d="M138,38 C140,52 142,60 144,68"/><path d="M58,42 C60,54 60,60 59,66"/><path d="M182,42 C180,54 180,60 181,66"/>
</g>
<!-- two guards Or, of gold braid -->
<path d="M37,74 C80,84 160,84 203,74 L203,81 C160,91 80,91 37,81 Z" fill="url(#co)" stroke="#8a6a14" stroke-width="0.9"/>
<path d="M38,88 C80,98 160,98 202,88 L201,95 C160,105 80,105 39,95 Z" fill="url(#co)" stroke="#8a6a14" stroke-width="0.9"/>
<!-- doubled Argent: the turn-up -->
<path d="M38,101 C80,112 160,112 202,101 C206,106 206,114 203,119 C160,131 80,131 37,119 C34,114 34,106 38,101 Z" fill="url(#ca)" stroke="#6f6f6f" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
