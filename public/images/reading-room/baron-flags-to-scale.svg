<text x="253.0" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#131e3a">1. Banner</text>
<text x="253.0" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2a2a2a">0.90 m (36 inches) square</text>
<text x="253.0" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#5c5648">The arms fill the whole flag</text>
