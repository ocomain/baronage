<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1375" width="900" height="1375" role="img" aria-labelledby="t d">
<title id="t">The five heraldic flags, drawn to the same scale</title>
<desc id="d">A square banner 0.90 metres each way; a tapering standard 3.5 metres long with a split rounded end; a guidon 2.40 metres long with a rounded end; a pennon 1.20 metres long ending in a point; and a triangular pinsel 0.60 metres high and 1.35 metres long. A figure 1.75 metres tall is shown for scale.</desc>
<rect width="900" height="1375" fill="#faf6ec"/>
<defs><pattern id="arms" width="1" height="1" patternContentUnits="objectBoundingBox"><rect width="1" height="1" fill="#faf6ec"/><path d="M0,0.78 L0.5,0.36 L1,0.78 L1,0.98 L0.5,0.56 L0,0.98 Z" fill="#131e3a"/><circle cx="0.22" cy="0.22" r="0.1" fill="#c9a24b" stroke="#131e3a" stroke-width="0.012"/><circle cx="0.78" cy="0.22" r="0.1" fill="#c9a24b" stroke="#131e3a" stroke-width="0.012"/><circle cx="0.5" cy="0.86" r="0.085" fill="#c9a24b" stroke="#131e3a" stroke-width="0.012"/></pattern></defs>
<text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#5c5648" font-style="italic">All five to the same scale</text>
<line x1="670.0" y1="44" x2="840.0" y2="44" stroke="#2a2a2a" stroke-width="3"/><line x1="670.0" y1="34" x2="670.0" y2="54" stroke="#2a2a2a" stroke-width="3"/><line x1="840.0" y1="34" x2="840.0" y2="54" stroke="#2a2a2a" stroke-width="3"/>
